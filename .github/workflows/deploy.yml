name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_CONTAINERAPP_NAME: monitor-worker
  AZURE_GROUP_NAME: rg-monitor-dev
  AZURE_LOCATION: eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore MonitorBackend.Worker/MonitorBackend.Worker.csproj

    - name: Build
      run: dotnet build MonitorBackend.Worker/MonitorBackend.Worker.csproj --no-restore -c Release

    - name: Test
      run: dotnet test MonitorBackend.Worker/MonitorBackend.Worker.csproj --no-build -c Release --verbosity normal

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Infrastructure
      run: |
        az deployment group create \
          --resource-group ${{ env.AZURE_GROUP_NAME }} \
          --template-file azure/main.bicep \
          --parameters azure/main.parameters.json \
          --parameters frontendUrl="${{ vars.FRONTEND_URL }}"

    - name: Get Container Registry details
      id: registry
      run: |
        REGISTRY_NAME=$(az deployment group show \
          --resource-group ${{ env.AZURE_GROUP_NAME }} \
          --name main \
          --query "properties.outputs.containerRegistryName.value" -o tsv)
        REGISTRY_SERVER=$(az deployment group show \
          --resource-group ${{ env.AZURE_GROUP_NAME }} \
          --name main \
          --query "properties.outputs.containerRegistryLoginServer.value" -o tsv)
        echo "name=$REGISTRY_NAME" >> $GITHUB_OUTPUT
        echo "server=$REGISTRY_SERVER" >> $GITHUB_OUTPUT

    - name: Login to Container Registry
      run: az acr login --name ${{ steps.registry.outputs.name }}

    - name: Build and push Docker image
      run: |
        IMAGE_TAG="${{ steps.registry.outputs.server }}/monitor-worker:${{ github.sha }}"
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Deploy to Container Apps
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINERAPP_NAME }} \
          --resource-group ${{ env.AZURE_GROUP_NAME }} \
          --image ${{ env.IMAGE_TAG }}

    - name: Get Container App URL
      run: |
        APP_URL=$(az containerapp show \
          --name ${{ env.AZURE_CONTAINERAPP_NAME }} \
          --resource-group ${{ env.AZURE_GROUP_NAME }} \
          --query "properties.configuration.ingress.fqdn" -o tsv)
        echo "Container App URL: https://$APP_URL"